<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background:#0d1117; font-family:Inter,system-ui,sans-serif; overflow-x:hidden; user-select:none; }
#root { display:flex; flex-direction:column; gap:8px; padding:6px 6px 10px; width:100%; }

.toolbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:2px 0 4px; min-height:32px; }
.btn { padding:4px 11px; border-radius:6px; border:1.5px solid #2d3650; background:transparent; color:#64748b;
       cursor:pointer; font-size:11px; font-weight:600; font-family:inherit; white-space:nowrap; flex-shrink:0; }
.btn:hover { border-color:#4a5568; color:#94a3b8; }
.btn.on-paint { border-color:#4ade80; background:#4ade8020; color:#4ade80; }
.btn.on-erase { border-color:#f87171; background:#f8717120; color:#f87171; }
.btn.on-vec   { border-color:#a78bfa; background:#a78bfa20; color:#a78bfa; }
.btn.on-place { border-color:#60a5fa; background:#60a5fa20; color:#60a5fa; }
.btn.on-move  { border-color:#f59e0b; background:#f59e0b20; color:#f59e0b; }
.btn.on-del   { border-color:#f87171; background:#f8717120; color:#f87171; }
.btn.danger:hover { border-color:#f87171; color:#f87171; }
.sep { width:1px; height:16px; background:#2d3650; flex-shrink:0; }
.sl-row { display:flex; align-items:center; gap:4px; }
.sl-lbl { color:#64748b; font-size:11px; white-space:nowrap; }
.sl-val { color:#e2e8f0; font-size:11px; min-width:24px; text-align:right; font-variant-numeric:tabular-nums; }
input[type=range] { -webkit-appearance:none; width:64px; height:4px; border-radius:2px; background:#2d3650; cursor:pointer; outline:none; flex-shrink:0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#4ade80; cursor:pointer; }
input[type=range].purple::-webkit-slider-thumb { background:#a78bfa; }

.cv-outer { width:100%; position:relative; }
#cvBg { position:relative!important; width:100%!important; height:auto!important; display:block; border-radius:7px; border:1px solid #2d3650; }
#cvMain, #cvOver, #cvVec {
  position:absolute; top:0; left:0; width:100%!important; height:100%!important; border-radius:7px;
}
#cvOver { pointer-events:auto; }
#cvVec  { pointer-events:none; display:none; }
#cursor-ring { position:absolute; pointer-events:none; border-radius:50%; border:2px solid #4ade8080; background:#4ade8010; display:none; transform:translate(-50%,-50%); }

.well-panel { width:100%; background:#1e2535; border:1px solid #f59e0b55; border-radius:8px; padding:10px 12px; display:none; flex-direction:column; gap:8px; }
.well-panel.show { display:flex; }
.wp-title { color:#f59e0b; font-size:12px; font-weight:700; }
.wp-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
.wp-row { display:flex; flex-direction:column; gap:3px; }
.wp-head { display:flex; justify-content:space-between; }
.wp-head .lbl { color:#64748b; font-size:11px; }
.wp-head .val { color:#e2e8f0; font-size:11px; font-variant-numeric:tabular-nums; }
input.wp-sl { -webkit-appearance:none; width:100%; height:4px; border-radius:2px; background:#2d3650; cursor:pointer; outline:none; }
input.wp-sl::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#f59e0b; cursor:pointer; }
.wp-footer { display:flex; justify-content:space-between; align-items:center; padding-top:6px; border-top:1px solid #2d3650; margin-top:2px; }
.wp-pos { color:#475569; font-size:10px; }
.wp-del { padding:4px 12px; border-radius:5px; border:1.5px solid #f8717155; background:#f8717115; color:#f87171; cursor:pointer; font-size:11px; font-weight:600; font-family:inherit; }

.save-row { display:flex; gap:6px; flex-wrap:wrap; }
.save-btn { padding:4px 10px; border-radius:6px; border:1.5px solid #2d3650; background:transparent; color:#64748b; cursor:pointer; font-size:11px; font-weight:600; font-family:inherit; white-space:nowrap; }
.save-btn:hover { border-color:#60a5fa55; color:#60a5fa; }

.hint { color:#475569; font-size:10px; }
.wcount { color:#64748b; font-size:11px; }
</style>
</head>
<body>
<div id="root">
  <div class="toolbar" id="tb"></div>
  <div class="cv-outer">
    <canvas id="cvBg"></canvas>
    <canvas id="cvMain"></canvas>
    <canvas id="cvVec"></canvas>
    <canvas id="cvOver"></canvas>
    <div id="cursor-ring"></div>
  </div>
  <div class="well-panel" id="wellPanel"></div>
  <div class="save-row" id="saveRow"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
// ── Streamlit protocol ────────────────────────────────────────────────────────
function toStreamlit(value) {
  window.parent.postMessage({ isStreamlitMessage:true, type:"streamlit:setComponentValue", value, dataType:"json" }, "*");
}
function setHeight(h) {
  window.parent.postMessage({ isStreamlitMessage:true, type:"streamlit:setFrameHeight", height:Math.ceil(h) }, "*");
}
function autoHeight() {
  requestAnimationFrame(() => setHeight(document.getElementById("root").getBoundingClientRect().height + 14));
}

// ── State ─────────────────────────────────────────────────────────────────────
let N=512, MODE="density";
let densityF32=null;   // [N*N]  density 0..1
// Vector field stored as DIRECTED unit vectors (cosθ, sinθ) — NOT double-angle.
// Converted to double-angle only when sending to Python.
let vecCxF32=null;     // [N*N]  cosθ of painted fiber direction
let vecCyF32=null;     // [N*N]  sinθ of painted fiber direction
let vecMagF32=null;    // [N*N]  accumulated paint weight 0..1
let wells=[];
let selWell=-1, hovWell=-1;
let tool="paint";
let brushSz=100, brushStr=60;

// Density stroke tracking
let painting=false, lastX=-1, lastY=-1;

// Vector stroke tracking — direction from consecutive mousemove positions
let vecPainting=false, vecLastX=-1, vecLastY=-1;

let drag=null;
let initialized=false;
let densityOwned=false, wellsOwned=false;

// ── Viridis ───────────────────────────────────────────────────────────────────
const VIR=[[68,1,84],[72,35,116],[64,67,135],[52,94,141],[41,120,142],
           [32,144,140],[34,167,132],[68,190,112],[121,209,81],[189,222,38],[253,231,37]];
function vir(v){
  v=Math.max(0,Math.min(1,v));
  const t=v*(VIR.length-1),i=Math.min(Math.floor(t),VIR.length-2),f=t-i;
  const a=VIR[i],b=VIR[i+1];
  return[a[0]+(b[0]-a[0])*f|0, a[1]+(b[1]-a[1])*f|0, a[2]+(b[2]-a[2])*f|0];
}

// ── DOM refs ──────────────────────────────────────────────────────────────────
let cvBg,cvMain,cvOver,cvVec,mainCtx,vecCtx,cursorRing;
function dispScale(){ return cvBg ? cvBg.clientWidth/N : 1; }

// ── Setup (once ever) ─────────────────────────────────────────────────────────
function setup(){
  cvBg=document.getElementById("cvBg");
  cvMain=document.getElementById("cvMain");
  cvOver=document.getElementById("cvOver");
  cvVec=document.getElementById("cvVec");
  cursorRing=document.getElementById("cursor-ring");
  // Set pixel resolution once — reassigning canvas width clears it
  for(const c of [cvBg,cvMain,cvOver,cvVec]){ c.width=N; c.height=N; }
  mainCtx=cvMain.getContext("2d");
  vecCtx=cvVec.getContext("2d");
  attachEvents(cvOver);
  window.addEventListener("mouseup", onWindowMouseUp);
  buildSaveRow();
  initialized=true;
}

// ── onRender ──────────────────────────────────────────────────────────────────
function onRender(args){
  const newMODE=args.mode||"density";
  if(!initialized){ N=args.canvas_size||512; setup(); }

  // Mode switch: rebuild UI only, never touch data buffers
  if(newMODE!==MODE){
    MODE=newMODE;
    if(MODE==="density"&&tool!=="paint"&&tool!=="erase"&&tool!=="vec") tool="paint";
    if(MODE==="wells"&&tool!=="place"&&tool!=="move"&&tool!=="del")    tool="place";
    buildToolbar(); buildHint(); updateWellPanel(); render(); autoHeight();
    return;
  }

  // First render only: load persisted state from Streamlit
  if(!densityOwned){
    densityF32=new Float32Array(N*N);
    vecCxF32=new Float32Array(N*N);
    vecCyF32=new Float32Array(N*N);
    vecMagF32=new Float32Array(N*N);
    if(args.density_b64) loadB64Into(args.density_b64, densityF32, N);
    // vec arrays arrive as double-angle from Python; convert back to directed on load
    if(args.vec_qx_b64 && args.vec_qy_b64){
      const tmpX=new Float32Array(N*N), tmpY=new Float32Array(N*N);
      loadB64Into(args.vec_qx_b64, tmpX, N);
      loadB64Into(args.vec_qy_b64, tmpY, N);
      for(let i=0;i<N*N;i++){
        // double-angle → directed: theta = 0.5*atan2(Qy,Qx)
        const theta=0.5*Math.atan2(tmpY[i],tmpX[i]);
        vecCxF32[i]=Math.cos(theta); vecCyF32[i]=Math.sin(theta);
      }
    }
    if(args.vec_mag_b64) loadB64Into(args.vec_mag_b64, vecMagF32, N);
    densityOwned=true;
  }
  if(!wellsOwned && args.wells){
    try{ wells=JSON.parse(args.wells); }catch(e){ wells=[]; }
  }

  buildToolbar(); buildHint(); updateWellPanel(); render(); autoHeight();
}

function loadB64Into(b64, buf, size){
  try{
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const view=new Float32Array(bytes.buffer);
    if(view.length===size*size) buf.set(view);
  }catch(e){}
}

// ── Save row ──────────────────────────────────────────────────────────────────
function buildSaveRow(){
  const row=document.getElementById("saveRow");
  row.innerHTML="";

  // SAVE — entirely client-side, no Streamlit round-trip needed
  const btnSave=document.createElement("button"); btnSave.className="save-btn";
  btnSave.textContent="💾 Save maps";
  btnSave.addEventListener("click",()=>{
    // Build the JSON payload in JS and trigger browser download directly
    const payload={
      canvas_size: N,
      // Store directed vectors as double-angle for Python compatibility
      density_b64:  f32ToB64(densityF32),
      vec_qx_b64:   f32ToB64(directedToDoubleAngle("x")),
      vec_qy_b64:   f32ToB64(directedToDoubleAngle("y")),
      vec_mag_b64:  f32ToB64(vecMagF32),
      wells:        JSON.parse(JSON.stringify(wells)),
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="shg_maps.json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });

  // LOAD from file — also client-side
  const fileInp=document.createElement("input"); fileInp.type="file"; fileInp.accept=".json"; fileInp.style.display="none";
  fileInp.addEventListener("change",()=>{
    const file=fileInp.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.density_b64) loadB64Into(data.density_b64, densityF32, N);
        // vec stored as double-angle; convert back to directed
        if(data.vec_qx_b64&&data.vec_qy_b64){
          const tmpX=new Float32Array(N*N), tmpY=new Float32Array(N*N);
          loadB64Into(data.vec_qx_b64, tmpX, N);
          loadB64Into(data.vec_qy_b64, tmpY, N);
          for(let i=0;i<N*N;i++){
            const theta=0.5*Math.atan2(tmpY[i],tmpX[i]);
            vecCxF32[i]=Math.cos(theta); vecCyF32[i]=Math.sin(theta);
          }
        }
        if(data.vec_mag_b64) loadB64Into(data.vec_mag_b64, vecMagF32, N);
        if(Array.isArray(data.wells)){ wells=data.wells; wellsOwned=true; }
        render(); buildToolbar();
        // Sync to Streamlit so render uses the loaded data
        emitAll();
      }catch(err){ alert("Failed to load map file:\n"+err); }
    };
    reader.readAsText(file);
    fileInp.value=""; // allow re-loading same file
  });

  const btnLoad=document.createElement("button"); btnLoad.className="save-btn";
  btnLoad.textContent="📂 Load maps";
  btnLoad.addEventListener("click",()=>fileInp.click());

  const btnDlD=document.createElement("button"); btnDlD.className="save-btn";
  btnDlD.textContent="↓ Density PNG";
  btnDlD.addEventListener("click",()=>downloadFieldPNG("density"));

  const btnDlV=document.createElement("button"); btnDlV.className="save-btn";
  btnDlV.textContent="↓ Vector PNG";
  btnDlV.addEventListener("click",()=>downloadFieldPNG("vector"));

  row.append(btnSave, fileInp, btnLoad, btnDlD, btnDlV);
}

// Convert in-memory directed (cosθ,sinθ) → double-angle Float32Array for Python
function directedToDoubleAngle(component){
  const out=new Float32Array(N*N);
  for(let i=0;i<N*N;i++){
    const cx=vecCxF32[i], cy=vecCyF32[i];
    // cos2θ = cx²-cy²,  sin2θ = 2·cx·cy
    out[i]= component==="x" ? cx*cx-cy*cy : 2*cx*cy;
  }
  return out;
}

function downloadFieldPNG(which){
  const tmp=document.createElement("canvas"); tmp.width=N; tmp.height=N;
  const ctx=tmp.getContext("2d");
  const imgD=ctx.createImageData(N,N);
  if(which==="density"){
    let mx=0; for(let i=0;i<N*N;i++) if(densityF32[i]>mx) mx=densityF32[i];
    for(let i=0;i<N*N;i++){
      const[r,g,b]=vir(mx>0?densityF32[i]/mx:0);
      imgD.data[i*4]=r;imgD.data[i*4+1]=g;imgD.data[i*4+2]=b;imgD.data[i*4+3]=255;
    }
  } else {
    // Hue = direction angle, saturation = 1, value = magnitude
    for(let i=0;i<N*N;i++){
      const mag=vecMagF32[i];
      const theta=Math.atan2(vecCyF32[i],vecCxF32[i]);
      const hue=((theta/Math.PI*180)%360+360)%360;
      const[r,g,b]=hsvToRgb(hue,1,mag);
      imgD.data[i*4]=r;imgD.data[i*4+1]=g;imgD.data[i*4+2]=b;imgD.data[i*4+3]=255;
    }
  }
  ctx.putImageData(imgD,0,0);
  const a=document.createElement("a"); a.href=tmp.toDataURL("image/png");
  a.download=which+"_field.png"; a.click();
}

function hsvToRgb(h,s,v){
  const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}

// ── Toolbar ───────────────────────────────────────────────────────────────────
function mkBtn(label,onClick,cls){
  const b=document.createElement("button"); b.className="btn"+(cls?" "+cls:"");
  b.textContent=label;
  b.addEventListener("mousedown",e=>e.stopPropagation());
  b.addEventListener("click",onClick);
  return b;
}
function mkSep(){ const d=document.createElement("div"); d.className="sep"; return d; }
function mkSlider(label,val,min,max,thumbCls,onChange){
  const row=document.createElement("div"); row.className="sl-row";
  const lbl=document.createElement("span"); lbl.className="sl-lbl"; lbl.textContent=label;
  const inp=document.createElement("input"); inp.type="range"; inp.min=min; inp.max=max; inp.value=val;
  if(thumbCls) inp.classList.add(thumbCls);
  const valEl=document.createElement("span"); valEl.className="sl-val"; valEl.textContent=val;
  inp.addEventListener("input",()=>{ valEl.textContent=inp.value; onChange(+inp.value); });
  row.append(lbl,inp,valEl);
  return row;
}

function buildToolbar(){
  const tb=document.getElementById("tb"); tb.innerHTML="";
  if(MODE==="density"){
    tb.append(
      mkBtn("＋ Paint", ()=>setTool("paint"), tool==="paint"?"on-paint":""),
      mkBtn("− Erase",  ()=>setTool("erase"), tool==="erase"?"on-erase":""),
      mkBtn("→ Vector", ()=>setTool("vec"),   tool==="vec"  ?"on-vec":  ""),
      mkSep(),
      mkSlider("Brush", brushSz, 4, 120, null,     v=>{brushSz=v;}),
      mkSlider("Str",   brushStr,1, 100, tool==="vec"?"purple":null, v=>{brushStr=v;}),
      mkSep(),
      mkBtn("Clear density",()=>{ densityF32.fill(0); render(); emitDensity(); },"danger"),
      mkBtn("Clear vectors", ()=>{ vecCxF32.fill(0); vecCyF32.fill(0); vecMagF32.fill(0); render(); emitVec(); },"danger")
    );
  } else {
    const cnt=document.createElement("span"); cnt.className="wcount";
    cnt.textContent=wells.length+" well"+(wells.length!==1?"s":"");
    tb.append(
      mkBtn("＋ Place",  ()=>setTool("place"), tool==="place"?"on-place":""),
      mkBtn("↖ Move",   ()=>setTool("move"),  tool==="move" ?"on-move" :""),
      mkBtn("✕ Delete", ()=>setTool("del"),   tool==="del"  ?"on-del"  :""),
      cnt,
      mkBtn("Clear all",()=>{ wells=[];selWell=-1;wellsOwned=true;updateWellPanel();render();emitWells();buildToolbar(); },"danger")
    );
  }
}

function setTool(t){
  tool=t; if(t!=="move"){selWell=-1;updateWellPanel();}
  buildToolbar(); buildHint();
  cvOver.style.cursor=t==="place"?"crosshair":t==="del"?"not-allowed":t==="move"?"default":"none";
  cvVec.style.display=t==="vec"?"block":"none";
  if(t!=="vec") vecCtx.clearRect(0,0,N,N);
}

function buildHint(){
  document.getElementById("hint").textContent=({
    paint:"Paint density — successive strokes accumulate.",
    erase:"Erase density.",
    vec:  "Drag to paint fiber orientation. The direction you drag is the fiber direction.",
    place:"Click to place an orientation well.",
    move: "Drag to reposition. Click to select and inspect.",
    del:  "Click a well to delete it.",
  })[tool]||"";
}

// ── Well inspector ────────────────────────────────────────────────────────────
function updateWellPanel(){
  const panel=document.getElementById("wellPanel");
  if(selWell<0||MODE!=="wells"){panel.classList.remove("show");autoHeight();return;}
  const w=wells[selWell];
  panel.innerHTML=`<div class="wp-title">Well ${selWell+1}</div>`;
  panel.classList.add("show");
  const grid=document.createElement("div"); grid.className="wp-grid";
  [["rx","Radius X",8,160],["ry","Radius Y",8,160],["angle","Angle °",0,179]].forEach(([key,lbl,mn,mx])=>{
    const row=document.createElement("div"); row.className="wp-row";
    const head=document.createElement("div"); head.className="wp-head";
    head.innerHTML=`<span class="lbl">${lbl}</span><span class="val" id="wpv-${key}">${Math.round(w[key])}</span>`;
    const inp=document.createElement("input"); inp.type="range"; inp.className="wp-sl";
    inp.min=mn;inp.max=mx;inp.value=w[key];
    inp.addEventListener("input",()=>{
      if(selWell<0)return;
      wells[selWell][key]=+inp.value;
      document.getElementById("wpv-"+key).textContent=Math.round(+inp.value);
      render();
    });
    inp.addEventListener("change",()=>emitWells());
    row.append(head,inp); grid.appendChild(row);
  });
  panel.appendChild(grid);
  const footer=document.createElement("div"); footer.className="wp-footer";
  const posEl=document.createElement("span"); posEl.className="wp-pos"; posEl.id="wp-pos";
  posEl.textContent=`x ${Math.round(w.x)}  y ${Math.round(w.y)}`;
  const delBtn=document.createElement("button"); delBtn.className="wp-del"; delBtn.textContent="Remove";
  delBtn.addEventListener("click",()=>{
    wells.splice(selWell,1);selWell=-1;wellsOwned=true;
    updateWellPanel();render();emitWells();buildToolbar();
  });
  footer.append(posEl,delBtn); panel.appendChild(footer);
  autoHeight();
}

// ── Rendering ─────────────────────────────────────────────────────────────────
let imgData=null;

function render(){
  if(!mainCtx||!densityF32) return;
  // Density → viridis
  let mx=0; for(let i=0;i<N*N;i++) if(densityF32[i]>mx) mx=densityF32[i];
  if(!imgData||imgData.width!==N) imgData=new ImageData(N,N);
  const d=imgData.data;
  for(let i=0;i<N*N;i++){
    const[r,g,b]=vir(mx>0?densityF32[i]/mx:0);
    d[i*4]=r;d[i*4+1]=g;d[i*4+2]=b;d[i*4+3]=255;
  }
  mainCtx.putImageData(imgData,0,0);
  drawVectorOverlay(mainCtx);
  if(MODE==="wells"){
    mainCtx.fillStyle="rgba(13,17,23,0.45)";
    mainCtx.fillRect(0,0,N,N);
    drawWells(mainCtx);
  }
}

function drawVectorOverlay(ctx){
  // Directed arrows: tail → head shows fiber direction
  const step=Math.max(12,Math.round(N/32));
  const alen=step*0.42;
  const hw=step*0.13; // arrowhead half-width
  ctx.save();
  for(let row=step/2;row<N;row+=step){
    for(let col=step/2;col<N;col+=step){
      const idx=Math.round(row)*N+Math.round(col);
      const mag=vecMagF32[idx]; if(mag<0.04) continue;
      const cx=vecCxF32[idx], cy=vecCyF32[idx];
      // tail and head of arrow
      const tx=col-cx*alen*mag, ty=row-cy*alen*mag;
      const hx=col+cx*alen*mag, hy=row+cy*alen*mag;
      // perpendicular for arrowhead
      const px=-cy, py=cx;
      const alpha=Math.round(Math.min(255,mag*200+80)).toString(16).padStart(2,"0");
      const color="#a78bfa"+alpha;
      ctx.strokeStyle=color; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(hx,hy); ctx.stroke();
      // arrowhead triangle
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(hx,hy);
      ctx.lineTo(hx-cx*hw*2+px*hw, hy-cy*hw*2+py*hw);
      ctx.lineTo(hx-cx*hw*2-px*hw, hy-cy*hw*2-py*hw);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

function drawWells(ctx){
  wells.forEach((w,i)=>{
    const isSel=selWell===i,isHov=hovWell===i,col=isSel?"#f59e0b":"#60a5fa";
    ctx.save(); ctx.translate(w.x,w.y); ctx.rotate(w.angle*Math.PI/180);
    if(isSel){ctx.shadowColor=col;ctx.shadowBlur=14;}
    ctx.beginPath(); ctx.ellipse(0,0,w.rx,w.ry,0,0,Math.PI*2);
    ctx.fillStyle=col+(isSel?"40":"22");
    ctx.strokeStyle=col+(isSel?"ff":isHov?"cc":"88");
    ctx.lineWidth=isSel?2:1.5; ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
    ctx.beginPath(); ctx.moveTo(-w.rx,0); ctx.lineTo(w.rx,0);
    ctx.strokeStyle=col+"99"; ctx.lineWidth=1; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
    for(const ex of[-w.rx,w.rx]){
      ctx.beginPath();ctx.moveTo(ex,-5);ctx.lineTo(ex,5);ctx.strokeStyle=col+"bb";ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.beginPath();ctx.moveTo(0,-w.ry);ctx.lineTo(0,w.ry);
    ctx.strokeStyle=col+"44";ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.stroke();ctx.setLineDash([]);
    ctx.font="bold 11px Inter,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle=col+(isSel?"ff":"cc");ctx.fillText(i+1,0,0);
    ctx.restore();
  });
}

// ── Vec cursor preview (drawn on cvVec, cleared between frames) ───────────────
function drawVecCursorAt(cx,cy,dirX,dirY){
  // Called every mousemove; shows brush circle + direction arrow
  vecCtx.clearRect(0,0,N,N);
  const len=Math.hypot(dirX,dirY);
  const nx= len>0 ? dirX/len : 1, ny= len>0 ? dirY/len : 0;
  const alen=brushSz*0.75;
  const hw=brushSz*0.14;
  const px=-ny, py=nx;
  // brush circle
  vecCtx.beginPath(); vecCtx.arc(cx,cy,brushSz,0,Math.PI*2);
  vecCtx.strokeStyle="#a78bfa66"; vecCtx.lineWidth=1.5; vecCtx.stroke();
  vecCtx.fillStyle="#a78bfa08"; vecCtx.fill();
  if(!vecPainting || len<2) return;
  // shaft
  const hx=cx+nx*alen, hy=cy+ny*alen;
  const tx=cx-nx*alen*0.6, ty=cy-ny*alen*0.6;
  vecCtx.beginPath(); vecCtx.moveTo(tx,ty); vecCtx.lineTo(hx,hy);
  vecCtx.strokeStyle="#a78bfadd"; vecCtx.lineWidth=2; vecCtx.stroke();
  // head
  vecCtx.fillStyle="#a78bfadd";
  vecCtx.beginPath();
  vecCtx.moveTo(hx,hy);
  vecCtx.lineTo(hx-nx*hw*2.5+px*hw, hy-ny*hw*2.5+py*hw);
  vecCtx.lineTo(hx-nx*hw*2.5-px*hw, hy-ny*hw*2.5-py*hw);
  vecCtx.closePath(); vecCtx.fill();
}

// ── Brushes ───────────────────────────────────────────────────────────────────
function applyDensityBrush(px,py){
  const r=brushSz,r2=r*r,str=(brushStr/100)*0.09,sign=tool==="erase"?-1:1;
  const x0=Math.max(0,px-r|0), x1=Math.min(N-1,px+r|0);
  const y0=Math.max(0,py-r|0), y1=Math.min(N-1,py+r|0);
  for(let y=y0;y<=y1;y++){
    const dy=y-py;
    for(let x=x0;x<=x1;x++){
      const d2=(x-px)*(x-px)+dy*dy; if(d2>r2) continue;
      const f=Math.cos(Math.sqrt(d2)/r*Math.PI*0.5);
      const idx=y*N+x;
      densityF32[idx]=Math.max(0,Math.min(1,densityF32[idx]+sign*str*f*f));
    }
  }
}

function strokeDensityTo(x1,y1){
  if(lastX<0){applyDensityBrush(x1,y1);lastX=x1;lastY=y1;return;}
  const dx=x1-lastX,dy=y1-lastY;
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(Math.max(1,brushSz)*0.35)));
  for(let i=1;i<=steps;i++) applyDensityBrush(lastX+dx*(i/steps),lastY+dy*(i/steps));
  lastX=x1;lastY=y1;
}

// Vector brush — direction comes from instantaneous movement (lastVec → current)
function applyVecBrush(px,py, dirX,dirY){
  const len=Math.hypot(dirX,dirY);
  if(len<0.5) return; // no direction info yet
  const nx=dirX/len, ny=dirY/len; // unit vector in drag direction
  const r=brushSz, r2=r*r;
  const maxMag=brushStr/100;
  const str=maxMag*0.12;
  const x0=Math.max(0,px-r|0), x1=Math.min(N-1,px+r|0);
  const y0=Math.max(0,py-r|0), y1=Math.min(N-1,py+r|0);
  for(let y=y0;y<=y1;y++){
    const dy=y-py;
    for(let x=x0;x<=x1;x++){
      const d2=(x-px)*(x-px)+dy*dy; if(d2>r2) continue;
      const f=Math.cos(Math.sqrt(d2)/r*Math.PI*0.5);
      const weight=str*f*f;
      const idx=y*N+x;
      const prevMag=vecMagF32[idx];
      const newMag=Math.min(maxMag, prevMag+weight);
      // Weighted blend of existing direction and new drag direction
      // Use the new mag as blend weight so we don't jerk
      const blend=weight/(prevMag+weight+1e-8);
      const ex=vecCxF32[idx]*(1-blend)+nx*blend;
      const ey=vecCyF32[idx]*(1-blend)+ny*blend;
      const elen=Math.hypot(ex,ey)+1e-8;
      vecCxF32[idx]=ex/elen; vecCyF32[idx]=ey/elen;
      vecMagF32[idx]=newMag;
    }
  }
}

function strokeVecTo(x1,y1){
  // Direction = instantaneous movement from last position
  if(vecLastX<0){vecLastX=x1;vecLastY=y1;return;}
  const dx=x1-vecLastX, dy=y1-vecLastY;
  const dist=Math.hypot(dx,dy);
  if(dist<1){return;} // not enough movement for a direction
  const steps=Math.max(1,Math.ceil(dist/(Math.max(1,brushSz)*0.35)));
  for(let i=1;i<=steps;i++){
    const sx=vecLastX+dx*(i/steps), sy=vecLastY+dy*(i/steps);
    // Each sub-step uses the same direction (dx,dy) — the direction of this segment
    applyVecBrush(sx,sy,dx,dy);
  }
  vecLastX=x1; vecLastY=y1;
}

// ── Hit test ──────────────────────────────────────────────────────────────────
function hitWell(mx,my){
  for(let i=wells.length-1;i>=0;i--){
    const w=wells[i],ang=-w.angle*Math.PI/180;
    const dx=mx-w.x,dy=my-w.y;
    const xr=dx*Math.cos(ang)-dy*Math.sin(ang),yr=dx*Math.sin(ang)+dy*Math.cos(ang);
    if((xr/w.rx)**2+(yr/w.ry)**2<=1.3) return i;
  }
  return -1;
}

// ── Events ────────────────────────────────────────────────────────────────────
function canvasXY(e){
  const r=cvOver.getBoundingClientRect();
  return[(e.clientX-r.left)*(N/r.width),(e.clientY-r.top)*(N/r.height)];
}

// Track last movement direction for vec cursor (even when not painting)
let moveLastX=-1, moveLastY=-1, moveDirX=1, moveDirY=0;

function attachEvents(cv){
  cv.addEventListener("mousedown",e=>{
    e.preventDefault();
    const[x,y]=canvasXY(e);
    if(MODE==="density"){
      if(tool==="vec"){
        vecPainting=true; vecLastX=-1; vecLastY=-1;
        // Don't apply on mousedown — wait for first movement to get a direction
      } else {
        painting=true; lastX=-1; lastY=-1;
        strokeDensityTo(x,y); render();
      }
    } else {
      const idx=hitWell(x,y);
      if(tool==="place"){
        wells.push({x,y,rx:45,ry:28,angle:0}); selWell=wells.length-1; wellsOwned=true;
        updateWellPanel();render();buildToolbar();
      } else if(tool==="del"){
        if(idx>=0){wells.splice(idx,1);selWell=-1;wellsOwned=true;updateWellPanel();render();emitWells();buildToolbar();}
      } else {
        const prev=selWell; selWell=idx;
        if(idx>=0) drag={idx,sx:x,sy:y,ox:wells[idx].x,oy:wells[idx].y};
        if(selWell!==prev) updateWellPanel();
        render();
      }
    }
    moveLastX=x; moveLastY=y;
  });

  cv.addEventListener("mousemove",e=>{
    const[x,y]=canvasXY(e);
    const sc=dispScale();
    // Track movement direction for cursor preview
    if(moveLastX>=0){
      const mdx=x-moveLastX, mdy=y-moveLastY;
      if(Math.hypot(mdx,mdy)>0.5){ moveDirX=mdx; moveDirY=mdy; }
    }
    moveLastX=x; moveLastY=y;

    if(MODE==="density"){
      if(tool==="vec"){
        cvVec.style.display="block";
        drawVecCursorAt(x,y,moveDirX,moveDirY);
        if(vecPainting){
          strokeVecTo(x,y);
          render();
          // Redraw cursor on top (render cleared the vec canvas indirectly — actually vec is separate)
          drawVecCursorAt(x,y,moveDirX,moveDirY);
        }
      } else {
        cvVec.style.display="none"; vecCtx.clearRect(0,0,N,N);
        cursorRing.style.display="block";
        cursorRing.style.left=x*sc+"px"; cursorRing.style.top=y*sc+"px";
        cursorRing.style.width=brushSz*2*sc+"px"; cursorRing.style.height=brushSz*2*sc+"px";
        cursorRing.style.borderColor=tool==="erase"?"#f8717188":"#4ade8088";
        cursorRing.style.background =tool==="erase"?"#f8717110":"#4ade8010";
        if(painting){strokeDensityTo(x,y);render();}
      }
    } else {
      cvVec.style.display="none"; vecCtx.clearRect(0,0,N,N);
      cursorRing.style.display="none";
      const prevH=hovWell; hovWell=hitWell(x,y);
      if(drag){
        wells[drag.idx].x=drag.ox+(x-drag.sx); wells[drag.idx].y=drag.oy+(y-drag.sy);
        const posEl=document.getElementById("wp-pos");
        if(posEl) posEl.textContent=`x ${Math.round(wells[drag.idx].x)}  y ${Math.round(wells[drag.idx].y)}`;
        render();
      } else if(hovWell!==prevH){render();}
    }
  });

  cv.addEventListener("mouseup", onCanvasMouseUp);
  cv.addEventListener("mouseleave",()=>{
    cursorRing.style.display="none";
    vecCtx.clearRect(0,0,N,N);
    moveDirX=1; moveDirY=0; moveLastX=-1; moveLastY=-1;
    hovWell=-1;
  });
}

function finishVecStroke(){
  vecPainting=false; vecLastX=-1; vecLastY=-1;
  vecCtx.clearRect(0,0,N,N);
  render(); emitVec();
}

function onCanvasMouseUp(){
  if(MODE==="density"){
    if(tool==="vec"&&vecPainting){ finishVecStroke(); }
    else if(painting){ painting=false;lastX=-1;lastY=-1;emitDensity(); }
  } else if(drag){ wellsOwned=true;emitWells();drag=null; }
}
function onWindowMouseUp(){
  if(tool==="vec"&&vecPainting){ finishVecStroke(); }
  else if(painting){ painting=false;lastX=-1;lastY=-1;emitDensity(); }
  if(drag){ wellsOwned=true;emitWells();drag=null; }
}

// ── Emit ──────────────────────────────────────────────────────────────────────
function f32ToB64(arr){
  const bytes=new Uint8Array(arr.buffer);
  const CHUNK=65536; let bin="";
  for(let i=0;i<bytes.length;i+=CHUNK) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CHUNK));
  return btoa(bin);
}
function emitDensity(){ toStreamlit({type:"density",density_b64:f32ToB64(densityF32),size:N}); }
function emitVec(){
  // Send to Python as double-angle for backend compatibility
  toStreamlit({type:"vec",
    vec_qx_b64:f32ToB64(directedToDoubleAngle("x")),
    vec_qy_b64:f32ToB64(directedToDoubleAngle("y")),
    vec_mag_b64:f32ToB64(vecMagF32),size:N});
}
function emitWells(){ toStreamlit({type:"wells",wells:JSON.parse(JSON.stringify(wells))}); }
function emitAll(){
  toStreamlit({type:"sync",
    density_b64:f32ToB64(densityF32),
    vec_qx_b64:f32ToB64(directedToDoubleAngle("x")),
    vec_qy_b64:f32ToB64(directedToDoubleAngle("y")),
    vec_mag_b64:f32ToB64(vecMagF32),
    wells:JSON.parse(JSON.stringify(wells)),size:N});
}

// ── Message listener ──────────────────────────────────────────────────────────
window.addEventListener("message",e=>{
  if(!e.data||e.data.type!=="streamlit:render") return;
  onRender(e.data.args||{});
});
window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
</script>
